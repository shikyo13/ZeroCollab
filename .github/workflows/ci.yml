name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - ROOM-QUICKSTART.md
      - 'Docs/**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - ROOM-QUICKSTART.md
      - 'Docs/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and build
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Check out clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/renderer/package-lock.json

      - name: Create clean Python environment
        run: python -m venv .venv

      - name: Install app dependencies
        run: .venv/Scripts/python.exe -m pip install -e .

      - name: Check Python dependencies
        run: .venv/Scripts/python.exe -m pip check

      - name: Use canonical temporary paths for fixtures
        shell: python
        run: |
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP']) / 'zerocollab-tests'
          temporary.mkdir(exist_ok=True)
          temporary = temporary.resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              for name in ('TEMP', 'TMP', 'TMPDIR'):
                  environment.write(f'{name}={temporary}\n')

      - name: Run existing app tests
        run: .venv/Scripts/python.exe -m unittest discover -s tests -q

      - name: Build app wheel
        run: .venv/Scripts/python.exe -m pip wheel --no-deps --wheel-dir build/wheels .

      - name: Check wheel module contents
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('build/wheels').glob('zerocollab-*.whl'))
          assert len(wheels) == 1, wheels
          expected = {p.relative_to('src').as_posix() for p in Path('src/zerocollab').rglob('*.py')}
          expected.add('zerocollab/providers/native_adapters.py')
          with ZipFile(wheels[0]) as wheel:
              missing = expected - set(wheel.namelist())
          assert not missing, f'Wheel is missing source modules: {sorted(missing)}'
          print(f'Checked {len(expected)} Python modules in {wheels[0].name}')

      - name: Install locked renderer dependencies
        run: npm ci --prefix apps/desktop/renderer --no-fund

      - name: Typecheck and build renderer
        run: npm run build

      - name: Prepare desktop resources from source
        run: .venv/Scripts/python.exe scripts/prepare_desktop.py

      - name: Check prepared desktop contracts and MCP child
        run: |
          @'
          from pathlib import Path
          import sys
          import unittest

          prepared = Path('build/desktop/resources/backend/src').resolve()
          sys.path.insert(0, str(prepared))
          sys.path.insert(0, str(Path('tests').resolve()))
          from zerocollab.providers import native_adapters

          assert Path(native_adapters.__file__).resolve().is_relative_to(prepared)
          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite([
              loader.loadTestsFromName('test_tool_contracts'),
              loader.loadTestsFromName(
                  'test_desktop_boundary.DesktopBoundaryChecks.'
                  'test_native_room_mcp_uses_host_dependencies_in_an_isolated_base_python'),
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          '@ | .venv/Scripts/python.exe -
