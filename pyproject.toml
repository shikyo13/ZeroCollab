[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocollab"
version = "0.1.6"
description = "Desktop workspace for collaborative coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp>=1.0,<2", "httpx>=0.27", "jsonschema>=4.23", "pillow>=10.1", "websockets>=12", "python-multipart>=0.0.9"]

[project.scripts]
zerocollab = "zerocollab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
