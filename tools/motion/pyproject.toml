[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocollab-motion"
version = "0.1.0"
description = "Independent scene rendering, media inspection and recording encoding"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "websockets>=12", "pillow>=10.1", "jsonschema>=4.23", "mcp>=1.0,<2"]

[project.scripts]
zerocollab-motion = "zerocollab_motion.cli:main"
zerocollab-motion-mcp = "zerocollab_motion.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zerocollab_motion = ["kit/**/*", "kit/*"]
